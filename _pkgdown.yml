url: https://gillescolling.com/vectra/
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    preset: sandstone
  includes:
    in_header: pkgdown/mathjax-config.html
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
articles:
- title: Guides
  navbar: ~
  contents:
  - quickstart
  - spatial
  - streaming-spatial
  - geometry-expressions
  - coverage-topology
  - networks
  - engine
  - formats
  - joins
  - schema
  - string-ops
  - indexing
  - large-data
  - sdm
  - offload
reference:
- title: Data sources
  desc: Open files for lazy query execution
  contents:
  - tbl
  - tbl_csv
  - tbl_sqlite
  - tbl_tiff
  - tbl_xlsx
- title: Data sinks
  desc: Write query results or data.frames to disk
  contents:
  - write_vtr
  - write_csv
  - write_sqlite
  - write_tiff
- title: GeoTIFF helpers
  desc: Metadata and point-sampling for GeoTIFF rasters
  contents:
  - tiff_extract_points
  - tiff_metadata
  - tiff_band_names
  - tiff_crs
- title: Raster data cubes
  desc: Read and write .vec rasters and time cubes out of core
  contents:
  - vec_open_raster
  - vec_close_raster
  - vec_raster_layout
  - vec_raster_times
  - vec_read_window
  - vec_read_time_slice
  - vec_read_pixel_series
  - vec_extract_points
  - vec_build_overviews
  - vec_write_raster
  - vec_write_time_cube
  - vec_to_tiff
- title: Spatial operations
  desc: Stream sf vector operations one batch at a time, for vector data larger than RAM
  contents:
  - spatial_map
  - spatial_join
  - grid
  - spatial_filter
  - spatial_clip
  - spatial_dissolve
  - spatial_overlay
  - rasterize
  - polygonize
  - contours
  - zonal
  - focal
  - terrain
  - warp
  - mask
  - mosaic
  - rast_calc
  - proximity
  - collect_sf
- title: File operations
  desc: Incremental updates to .vtr files
  contents:
  - append_vtr
  - delete_vtr
  - diff_vtr
  - create_index
  - has_index
- title: Single-table verbs
  desc: Transform, filter, and reshape
  contents:
  - filter
  - select
  - mutate
  - transmute
  - rename
  - relocate
  - arrange
  - desc
  - distinct
  - slice_head
  - slice_tail
  - slice_min
  - slice_max
  - slice
  - pull
  - head.vectra_node
- title: Grouping and aggregation
  contents:
  - group_by
  - summarise
  - ungroup
  - count
  - reframe
  - across
- title: Joins
  contents:
  - left_join
  - inner_join
  - right_join
  - full_join
  - semi_join
  - anti_join
  - cross_join
  - fuzzy_join
- title: Star schema
  desc: Define linked dimension tables and look up columns without explicit joins
  contents:
  - vtr_schema
  - link
  - lookup
- title: Combining tables
  contents:
  - bind_rows
  - bind_cols
- title: Block operations
  desc: In-memory materialization and lookup
  contents:
  - materialize
  - block_lookup
  - block_fuzzy_lookup
- title: Streaming consumption
  desc: Reduce or feed a query one batch at a time, for larger-than-RAM results
  contents:
  - collect_chunked
  - chunk_feeder
- title: Offloading
  desc: Spill a query to disk and stream it back, for out-of-core fits
  contents:
  - offload
  - group_map
  - group_modify
- title: Diagnostics
  contents:
  - explain
  - collect
  - glimpse
  - print.vectra_node

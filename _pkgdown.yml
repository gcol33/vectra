url: https://gillescolling.com/vectra/
template:
  bootstrap: 5
  light-switch: yes
  bslib:
    preset: sandstone
  includes:
    in_header: pkgdown/mathjax-config.html
navbar:
  structure:
    left:
    - intro
    - articles
    - reference
    - news
    right:
    - search
    - github
articles:
- title: Guides
  navbar: ~
  contents:
  - quickstart
  - engine
  - formats
  - joins
  - schema
  - string-ops
  - indexing
  - large-data
reference:
- title: Data sources
  desc: Open files for lazy query execution
  contents:
  - tbl
  - tbl_csv
  - tbl_sqlite
  - tbl_tiff
  - tbl_xlsx
- title: Data sinks
  desc: Write query results or data.frames to disk
  contents:
  - write_vtr
  - write_csv
  - write_sqlite
  - write_tiff
- title: File operations
  desc: Incremental updates to .vtr files
  contents:
  - append_vtr
  - delete_vtr
  - diff_vtr
  - create_index
  - has_index
- title: Single-table verbs
  desc: Transform, filter, and reshape
  contents:
  - filter
  - select
  - mutate
  - transmute
  - rename
  - relocate
  - arrange
  - desc
  - distinct
  - slice_head
  - slice_tail
  - slice_min
  - slice_max
  - slice
  - pull
  - head.vectra_node
- title: Grouping and aggregation
  contents:
  - group_by
  - summarise
  - ungroup
  - count
  - reframe
  - across
- title: Joins
  contents:
  - left_join
  - inner_join
  - right_join
  - full_join
  - semi_join
  - anti_join
  - cross_join
  - fuzzy_join
- title: Star schema
  desc: Define linked dimension tables and look up columns without explicit joins
  contents:
  - vtr_schema
  - link
  - lookup
- title: Combining tables
  contents:
  - bind_rows
  - bind_cols
- title: Block operations
  desc: In-memory materialization and lookup
  contents:
  - materialize
  - block_lookup
  - block_fuzzy_lookup
- title: Diagnostics
  contents:
  - explain
  - collect
  - glimpse
  - print.vectra_node

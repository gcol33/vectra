name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TDC: ${{ github.workspace }}/tdc
      # Suppress ASan's initial-library-order check. covr rebuilds vectra
      # with --coverage on top of whatever flags Ubuntu noble's R toolchain
      # injects, and the resulting test process triggers
      #   ==PID==ASan runtime does not come first in initial library list
      # at shutdown -- after tests have already passed -- because some
      # transitive object registers an ASan initializer although we never
      # asked for -fsanitize=address. The real ASan/UBSAN job (see
      # sanitizers.yml) owns sanitizer coverage with proper LD_PRELOAD, so
      # for test-coverage the check is purely spurious. verify_asan_link_order
      # is the documented LLVM ASan flag for disabling this exact check.
      ASAN_OPTIONS: verify_asan_link_order=0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gcol33/tdc
          token: ${{ secrets.TDC_TOKEN }}
          path: tdc

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: ${{ github.event_name != 'pull_request' && true || false }}
          file: ./cobertura.xml
          plugin: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package

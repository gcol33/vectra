name: ASAN/UBSAN

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    runs-on: ubuntu-latest
    name: Linux debug (ASAN + UBSAN)

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      TDC: ${{ github.workspace }}/tdc
      # ASAN/UBSAN runtime options
      ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: gcol33/tdc
          token: ${{ secrets.TDC_TOKEN }}
          path: tdc

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Find libasan path
        id: asan
        run: |
          ASAN_LIB=$(gcc -print-file-name=libasan.so)
          echo "lib=$ASAN_LIB" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Configure sanitizer build flags
        run: |
          mkdir -p ~/.R
          cat > ~/.R/Makevars <<'EOF'
          CC = gcc -std=gnu2x
          CFLAGS = -O1 -g -Wall -pedantic -fno-omit-frame-pointer -fsanitize=address,undefined -UNDEBUG
          CXXFLAGS = -O1 -g -Wall -pedantic -fno-omit-frame-pointer -fsanitize=address,undefined -UNDEBUG
          LDFLAGS = -fsanitize=address,undefined
          EOF
          cat ~/.R/Makevars
        shell: bash

      - name: Install package (debug + sanitized)
        env:
          LD_PRELOAD: ${{ steps.asan.outputs.lib }}
        run: |
          install.packages(".", repos = NULL, type = "source",
                           INSTALL_opts = "--no-multiarch")
        shell: Rscript {0}

      - name: Run tests under sanitizers
        env:
          LD_PRELOAD: ${{ steps.asan.outputs.lib }}
        run: |
          library(testthat)
          library(vectra)
          test_results <- test_dir("tests/testthat", reporter = "summary",
                                    package = "vectra", load_package = "none")
          if (any(as.data.frame(test_results)$failed > 0)) quit(status = 1)
        shell: Rscript {0}

      # Render every vignette under the sanitizers. BDR's gcc-ASAN run
      # at CRAN exercises vignettes (where 0.5.1's heap-buffer-overflow
      # in vtr1_tdc.c surfaced); the test suite alone does not, so we
      # explicitly render each one here and fail on any ASAN/UBSAN trap.
      - name: Render vignettes under sanitizers
        env:
          LD_PRELOAD: ${{ steps.asan.outputs.lib }}
        run: |
          vigs <- list.files("vignettes", pattern = "\\.Rmd$", full.names = TRUE)
          out_dir <- tempfile("vig"); dir.create(out_dir)
          for (v in vigs) {
            cat(">> rendering ", v, "\n", sep = "")
            rmarkdown::render(v,
                              output_format = "html_document",
                              output_dir    = out_dir,
                              quiet         = TRUE,
                              envir         = new.env())
          }
        shell: Rscript {0}

      - name: Run package examples under sanitizers
        env:
          LD_PRELOAD: ${{ steps.asan.outputs.lib }}
        run: |
          library(vectra)
          tools::testInstalledPackage(
            "vectra",
            outDir   = tempfile("ex"),
            types    = "examples",
            errorsAreFatal = TRUE
          )
        shell: Rscript {0}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs
          path: |
            /tmp/*.log
            /tmp/Rtmp*
